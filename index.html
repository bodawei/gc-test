<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consonant Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Consonant Counter</h1>
    <label for="text-input">Enter your text:</label>
    <textarea id="text-input" rows="6"></textarea>
    <p id="result">Consonants: <span id="count" aria-live="polite" role="status">0</span></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
